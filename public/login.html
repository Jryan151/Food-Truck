<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Online Kitchen</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-sm text-center">
        <a href="/" class="text-3xl font-serif font-bold italic tracking-wide block mb-1">Log in</a>
        <p class="text-zinc-400 text-sm mb-6">Go to your truck's kitchen portal</p>
        <form id="f" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4 shadow-xl text-left">
            <div>
                <label class="block text-xs text-zinc-400 mb-1 font-medium" for="email">Email</label>
                <input id="email" type="email" autocomplete="username" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200">
            </div>
            <div>
                <label class="block text-xs text-zinc-400 mb-1 font-medium" for="pw">Password</label>
                <input id="pw" type="password" autocomplete="current-password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200">
            </div>
            <div id="msg" class="text-xs text-center" style="display:none;"></div>
            <button id="btn" type="submit" class="w-full bg-zinc-100 hover:bg-white text-zinc-950 font-semibold py-3 rounded-xl transition shadow-lg">Log In</button>
            <div class="flex justify-between text-[11px]">
                <button type="button" id="forgot" class="text-zinc-400 hover:text-white underline">Forgot password?</button>
                <a href="/signup.html" class="text-zinc-400 hover:text-white underline">Create a free page</a>
            </div>
        </form>
        <p class="text-[11px] text-zinc-600 mt-4">Staff: open your truck's page and tap “Owner login” at the bottom, then use the staff PIN.</p>
    </div>
    <script>
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        function say(t, good) { var m = $('msg'); m.textContent = t; m.className = 'text-xs text-center ' + (good ? 'text-emerald-400' : 'text-rose-400'); m.style.display = t ? 'block' : 'none'; }
        function post(url, body) {
            return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
                .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
                .catch(function () { return { ok: false, d: { error: 'Connection problem. Please try again.' } }; });
        }
        $('f').addEventListener('submit', function (e) {
            e.preventDefault(); say('');
            var b = $('btn'); b.disabled = true; b.textContent = 'Logging in…';
            post('/api/auth/login', { email: $('email').value.trim(), password: $('pw').value }).then(function (r) {
                if (r.ok && r.d.redirect) { location.href = r.d.redirect; return; }
                b.disabled = false; b.textContent = 'Log In';
                say(r.d.error || 'Could not log in.');
            });
        });
        $('forgot').addEventListener('click', function () {
            var em = $('email').value.trim();
            if (!em) { say('Enter your email above first.'); return; }
            post('/api/auth/forgot', { email: em }).then(function () { say('If that email has an account, we sent a reset link.', true); });
        });
    })();
    </script>
</body>
</html>
