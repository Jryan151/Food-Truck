<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — Online Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/theme.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-sm text-center">
        <h1 class="text-3xl font-serif font-bold italic tracking-wide mb-1">New password</h1>
        <p class="text-zinc-400 text-sm mb-6">Choose a new password for your account</p>
        <form id="f" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4 shadow-xl text-left">
            <div>
                <label class="block text-xs text-zinc-400 mb-1 font-medium" for="pw">New password (8+ characters)</label>
                <input id="pw" type="password" autocomplete="new-password" minlength="8" maxlength="72" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200">
            </div>
            <div id="msg" class="text-xs text-center" style="display:none;"></div>
            <button id="btn" type="submit" class="w-full bg-zinc-100 hover:bg-white text-zinc-950 font-semibold py-3 rounded-xl transition shadow-lg">Save Password</button>
        </form>
        <a id="toLogin" href="/login.html" class="text-xs text-zinc-400 hover:text-white underline mt-4 inline-block" style="display:none;">Go to log in</a>
    </div>
    <script>
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        var token = new URLSearchParams(location.search).get('token') || '';
        function say(t, good) { var m = $('msg'); m.textContent = t; m.className = 'text-xs text-center ' + (good ? 'text-emerald-400' : 'text-rose-400'); m.style.display = t ? 'block' : 'none'; }
        if (!token) { say('This reset link is missing its code. Request a new one from the log in page.'); $('btn').disabled = true; $('toLogin').style.display = 'inline-block'; }
        $('f').addEventListener('submit', function (e) {
            e.preventDefault(); say('');
            var b = $('btn'); b.disabled = true;
            fetch('/api/auth/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, password: $('pw').value }) })
                .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
                .catch(function () { return { ok: false, d: { error: 'Connection problem. Please try again.' } }; })
                .then(function (r) {
                    if (r.ok) { say('Password updated. You can log in now.', true); $('f').style.display = 'none'; $('toLogin').style.display = 'inline-block'; history.replaceState(null, '', location.pathname); }
                    else { b.disabled = false; say(r.d.error || 'Could not reset.'); }
                });
        });
    })();
    </script>
</body>
</html>
